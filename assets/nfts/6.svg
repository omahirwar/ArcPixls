  <rect x="17" y="2" width="3" height="3" fill="#18181b"/>
  <rect x="22" y="3" width="3" height="3" fill="#09090b"/>
  <rect x="5" y="6" width="3" height="3" fill="#09090b"/>
  <rect x="24" y="6" width="3" height="3" fill="#09090b"/>
</svg>
