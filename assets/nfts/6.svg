  <path d="M9,21 h14 v11 h-14 z" fill="#15803d"/>
  <rect x="15" y="22" width="2" height="10" fill="#0f172a"/>
  <rect x="14" y="23" width="1" height="6" fill="#22c55e"/>
  <rect x="17" y="23" width="1" height="6" fill="#22c55e"/>

  <!-- Skin & Head -->
