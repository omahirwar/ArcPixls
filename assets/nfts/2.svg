<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- Clean White Background with subtle particles -->
  <rect width="32" height="32" fill="#ffffff"/>
  <rect x="4" y="6" width="1" height="1" fill="#c084fc" opacity="0.4"/>
  <rect x="27" y="11" width="1" height="1" fill="#e4e4e7"/>
  <rect x="3" y="20" width="1" height="1" fill="#c084fc" opacity="0.3"/>
  <rect x="28" y="25" width="1" height="1" fill="#c084fc" opacity="0.4"/>

  <!-- Dark Green Hoodie -->
  <path d="M7,20 h18 v12 h-18 z" fill="#14532d"/>
  <path d="M9,21 h14 v11 h-14 z" fill="#15803d"/>
  <rect x="15" y="22" width="2" height="10" fill="#0f172a"/>
  <!-- Yellow badge on sleeve -->
  <rect x="8" y="25" width="2" height="2" fill="#facc15"/>

  <!-- Skin & Head -->
  <path d="M10,11 h12 v10 h-12 z" fill="#d97706"/>
  <path d="M11,12 h10 v8 h-10 z" fill="#f59e0b"/>

  <!-- Eyes & Mouth -->
  <rect x="12" y="14" width="2" height="2" fill="#18181b"/>
  <rect x="18" y="14" width="2" height="2" fill="#18181b"/>
  <rect x="15" y="18" width="3" height="1" fill="#b45309"/>

  <!-- Spiky Green Hair -->
  <path d="M7,5 h18 v7 h-18 z" fill="#16a34a"/>
  <path d="M8,4 h16 v2 h-16 z" fill="#22c55e"/>
  <!-- Hair Spikes -->
  <rect x="7" y="3" width="3" height="3" fill="#22c55e"/>
  <rect x="12" y="2" width="3" height="3" fill="#4ade80"/>
  <rect x="17" y="2" width="3" height="3" fill="#22c55e"/>
  <rect x="22" y="3" width="3" height="3" fill="#16a34a"/>
  <rect x="5" y="6" width="3" height="3" fill="#15803d"/>
  <rect x="24" y="6" width="3" height="3" fill="#15803d"/>
</svg>
