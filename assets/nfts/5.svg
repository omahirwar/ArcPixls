  <rect x="18" y="2" width="3" height="3" fill="#3b82f6"/>
  <rect x="22" y="3" width="3" height="3" fill="#2563eb"/>

  <!-- Cyan Blue Over-Ear Headphones -->
  <path d="M10,4 h12 v2 h-12 z" fill="#0284c7"/>
