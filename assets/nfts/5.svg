  <rect x="29" y="10" width="1" height="1" fill="#c084fc" opacity="0.4"/>

  <!-- Dark Purple Hoodie -->
  <path d="M7,20 h18 v12 h-18 z" fill="#1e1b4b"/>
  <path d="M9,21 h14 v11 h-14 z" fill="#312e81"/>
