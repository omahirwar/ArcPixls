  <!-- Yellow Drawstrings -->
  <rect x="14" y="22" width="1" height="6" fill="#f59e0b"/>
  <rect x="17" y="22" width="1" height="6" fill="#f59e0b"/>

  <!-- Skin & Head -->
  <path d="M10,11 h12 v10 h-12 z" fill="#d97706"/>
  <path d="M11,12 h10 v8 h-10 z" fill="#f59e0b"/>

