<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- Clean White Background with subtle particles -->
  <rect width="32" height="32" fill="#ffffff"/>
  <rect x="4" y="5" width="1" height="1" fill="#c084fc" opacity="0.4"/>
  <rect x="28" y="10" width="1" height="1" fill="#c084fc" opacity="0.4"/>

  <!-- Black Hoodie Body & Shadow -->
  <path d="M7,20 h18 v12 h-18 z" fill="#121218"/>
  <path d="M9,21 h14 v11 h-14 z" fill="#1c1c24"/>
  <rect x="15" y="22" width="2" height="10" fill="#09090b"/>
  <!-- Yellow patch on sleeve -->
  <rect x="7" y="24" width="2" height="2" fill="#facc15"/>

  <!-- Horned Helmet Base -->
  <path d="M9,9 h14 v12 h-14 z" fill="#0d0d14"/>

  <!-- Horns (White/Beige) -->
  <path d="M8,6 h3 v4 h-3 z" fill="#e2e8f0"/>
  <path d="M7,4 h2 v3 h-2 z" fill="#ffffff"/>
  <path d="M21,6 h3 v4 h-3 z" fill="#e2e8f0"/>
  <path d="M23,4 h2 v3 h-2 z" fill="#ffffff"/>

  <!-- Screen Visor -->
  <path d="M10,13 h12 v6 h-12 z" fill="#050508"/>
  <rect x="11" y="12" width="10" height="1" fill="#1e1e2e"/>

  <!-- Green Glowing X X Eyes -->
  <!-- Left X -->
  <rect x="12" y="14" width="1" height="1" fill="#22c55e"/>
  <rect x="14" y="14" width="1" height="1" fill="#22c55e"/>
  <rect x="13" y="15" width="1" height="1" fill="#4ade80"/>
  <rect x="12" y="16" width="1" height="1" fill="#22c55e"/>
  <rect x="14" y="16" width="1" height="1" fill="#22c55e"/>

  <!-- Right X -->
  <rect x="17" y="14" width="1" height="1" fill="#22c55e"/>
  <rect x="19" y="14" width="1" height="1" fill="#22c55e"/>
  <rect x="18" y="15" width="1" height="1" fill="#4ade80"/>
  <rect x="17" y="16" width="1" height="1" fill="#22c55e"/>
  <rect x="19" y="16" width="1" height="1" fill="#22c55e"/>
</svg>
